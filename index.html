<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Factory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Anek+Telugu:wght@400;600&display=swap">
<style>
:root{--bg:#edeff2;--surface:#fff;--ink:#172033;--mute:#5d6678;--line:#d5d9e0;--ok:#0e8f7e;--bad:#c8283c;--warn:#b87800;--clap:#172033;--clap2:#f5c400}
@media (prefers-color-scheme:dark){:root{--bg:#10141e;--surface:#182030;--ink:#e8ecf4;--mute:#9aa4b8;--line:#2a3347;--ok:#35c4ae;--bad:#ff6b7d;--warn:#f0b43c;--clap:#e8ecf4;--clap2:#f5c400}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.clap{height:22px;background:repeating-linear-gradient(-45deg,var(--clap) 0 26px,var(--clap2) 26px 52px)}
main{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.03em;margin:.2em 0 0}
.te{font-family:"Anek Telugu",sans-serif}
.sub{color:var(--mute);margin:0 0 28px}
h2{font-size:1.15rem;margin:36px 0 12px}
.flow{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.node{flex:1 0 128px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--mute);padding:12px;position:relative;margin-right:18px}
.node:not(:last-child)::after{content:"";position:absolute;right:-19px;top:50%;width:18px;height:2px;background:var(--line)}
.node.ok{border-top-color:var(--ok)}.node.fail{border-top-color:var(--bad)}.node.stale{border-top-color:var(--warn)}
.node b{display:block;font-size:1.05rem;text-transform:capitalize}.node small{color:var(--mute);display:block}
.st{font-weight:600}.ok .st{color:var(--ok)}.fail .st{color:var(--bad)}.stale .st{color:var(--warn)}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:24px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600}
.tbl{overflow-x:auto}.err{color:var(--bad);font-size:.82rem;word-break:break-word}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--line)}
.pill.ok{color:var(--ok)}.pill.fail{color:var(--bad)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar i{display:block;height:14px;background:var(--ok);min-width:2px}.bar span{font-size:.88rem;min-width:130px}
ul{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line)}li{padding:10px 12px;border-bottom:1px solid var(--line)}
a{color:inherit}a:focus-visible{outline:3px solid var(--clap2);outline-offset:2px}.empty{color:var(--mute);padding:14px;background:var(--surface);border:1px dashed var(--line)}
</style></head><body>
<div class="clap" aria-hidden="true"></div>
<main>
<h1>Reel Factory <span class="te">రీల్ ఫ్యాక్టరీ</span></h1>
<p class="sub" id="meta">Loading pipeline data…</p>
<h2>Pipeline</h2><div class="flow" id="flow"></div>
<div class="grid">
 <section><h2>Recent runs</h2><div class="tbl" id="runs"></div></section>
 <section><h2>Published videos</h2><div id="pubs"></div>
  <h2>Which hooks win (avg views)</h2><div id="hooks"></div>
  <h2>Schedule</h2><ul><li>Shorts: every day, 08:00 IST</li><li>Instagram Reels: every 2 days, 18:00 IST</li><li>Long video: Sundays, 09:00 IST</li><li>Analytics refresh: daily, 23:30 IST</li></ul></section>
</div>
</main>
<script>
const STAGES=["research","script","voice","footage","render","publish","analytics"];
const q=new URLSearchParams(location.search);
let repo=q.get("repo");
if(!repo&&location.hostname.endsWith(".github.io"))repo=location.hostname.split(".")[0]+"/"+location.pathname.split("/")[1];
const local=location.protocol==="file:"||location.hostname==="localhost";
const url=f=>local?`../data/${f}`:`https://raw.githubusercontent.com/${repo}/main/data/${f}`;
const get=async f=>{try{return await (await fetch(url(f),{cache:"no-store"})).json()}catch{return []}};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ago=ts=>{const m=(Date.now()-new Date(ts))/6e4;return m<60?Math.round(m)+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
(async()=>{
 const logs={};for(const s of STAGES)logs[s]=await get(s+"_log.json");
 const flow=document.getElementById("flow");
 STAGES.forEach(s=>{const l=logs[s],last=l[l.length-1],n=el("div","node");
  if(!last){n.classList.add("stale");n.append(el("b","",s),el("span","st","No runs yet"));}
  else{const old=(Date.now()-new Date(last.ts))>3*864e5&&s!=="analytics";n.classList.add(last.status==="fail"?"fail":old?"stale":"ok");
   const w=l.slice(-20),okr=Math.round(100*w.filter(x=>x.status==="ok").length/w.length);
   n.append(el("b","",s),el("span","st",last.status==="fail"?"Failed":old?"Stale":"Healthy"),el("small","",ago(last.ts)),el("small","",`${okr}% ok · ${last.seconds}s`));}
  flow.append(n)});
 const all=STAGES.flatMap(s=>logs[s]).sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,25);
 const runs=document.getElementById("runs");
 if(!all.length)runs.append(el("div","empty","No runs yet. Start the pipeline from the Actions tab."));
 else{const t=el("table"),h=el("tr");["When","Stage","Detail","Status"].forEach(x=>h.append(el("th","",x)));t.append(h);
  all.forEach(r=>{const tr=el("tr"),d=el("td");d.append(el("span","",[r.target,r.kind,r.topic].filter(Boolean).join(" / ")));
   if(r.error)d.append(el("div","err",r.error));if(r.dry_run)d.append(el("div","",""),el("small","","dry-run (no API key)"));
   const s=el("td");s.append(el("span","pill "+r.status,r.status));
   tr.append(el("td","",ago(r.ts)),el("td","",r.stage),d,s);t.append(tr)});runs.append(t)}
 const pubs=(logs.publish||[]).filter(p=>p.status==="ok").reverse().slice(0,8),pb=document.getElementById("pubs");
 if(!pubs.length)pb.append(el("div","empty","Nothing published yet."));
 else{const u=el("ul");pubs.forEach(p=>{const li=el("li");
  if(p.video_id){const a=el("a","te",p.title);a.href="https://youtube.com/watch?v="+encodeURIComponent(p.video_id);a.target="_blank";a.rel="noopener";li.append(a)}else li.append(el("span","te",p.title));
  li.append(el("small","",` ${p.platform} · ${p.target} · ${ago(p.ts)}`));u.append(li)});pb.append(u)}
 const an=await get("analytics.json"),by={};an.forEach(v=>(by[v.formula]=by[v.formula]||[]).push(v.views));
 const hk=document.getElementById("hooks"),rows=Object.entries(by).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length]).sort((a,b)=>b[1]-a[1]);
 if(!rows.length)hk.append(el("div","empty","Needs a few published videos with stats."));
 else{const mx=Math.max(...rows.map(r=>r[1]),1);rows.forEach(([k,v])=>{const b=el("div","bar"),i=el("i");i.style.width=(v/mx*55)+"%";b.append(el("span","",k.replaceAll("_"," ")),i,el("small","",Math.round(v)));hk.append(b)})}
 document.getElementById("meta").textContent="Updated "+new Date().toLocaleString()+(local?" (local data)":" · "+repo);
})();
</script></body></html>
