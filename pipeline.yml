name: pipeline
on:
  schedule:
    - cron: "30 2 * * *"      # Short every day, 08:00 IST
    - cron: "30 12 */2 * *"   # Reel every 2 days, 18:00 IST
    - cron: "30 3 * * 0"      # Long video every Sunday, 09:00 IST
  workflow_dispatch:
    inputs:
      target: { type: choice, options: [short, reel, long], default: short }
      kind:   { description: "myth | tech | rhyme | reel (blank = auto rotation)", required: false }
permissions: { contents: write }
concurrency: { group: pipeline, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-telu
      - run: pip install -r requirements.txt
      - id: t
        run: |
          case "${{ github.event.schedule }}" in
            "30 2 * * *") T=short;;
            "30 12 */2 * *") T=reel;;
            "30 3 * * 0") T=long;;
            *) T="${{ inputs.target }}";;
          esac
          echo "target=$T" >> "$GITHUB_OUTPUT"
      - id: mk
        run: |
          KIND="${{ inputs.kind }}"
          python run.py make --target "${{ steps.t.outputs.target }}" ${KIND:+--kind "$KIND"} --publish
      - name: Instagram Reel (needs a PUBLIC repo so Meta can fetch the video)
        if: steps.t.outputs.target == 'reel' && env.IG_ACCESS_TOKEN != ''
        run: |
          ID="${{ steps.mk.outputs.run_id }}"
          gh release create "r-$ID" "output/$ID/final.mp4#video.mp4" --title "$ID" --notes "auto"
          python run.py publish-ig --run-id "$ID" --url "https://github.com/${{ github.repository }}/releases/download/r-$ID/video.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ github.run_id }}
          path: "output/**/final.mp4"
          retention-days: 7
      - name: Commit monitoring data
        if: always()
        run: |
          git config user.name "reel-factory-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "data: ${{ steps.mk.outputs.run_id }}"; git pull --rebase; git push; }
