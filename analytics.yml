name: analytics
on:
  schedule: [{ cron: "0 18 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pipeline, cancel-in-progress: false }
jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python run.py analytics
      - run: |
          git config user.name "reel-factory-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "data: analytics"; git pull --rebase; git push; }
